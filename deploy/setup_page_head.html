<title>GBP/JPY-Alarm einrichten</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine ruhige Lesespalte, nummerierte Schritte mit Zeitleiste links, Formular als einziger hervorgehobener Block */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --fg: #172033;
  --muted: #5a6478;
  --line: #d8dde6;
  --accent: #2a52be;
  --accent-soft: #e6ecfa;
  --up: #0d8a5c;
  --down: #c03c35;
  --warn-bg: #fff6e0;
  --warn-fg: #6b4a00;
  --bubble: #dcf8c6;
  --bubble-fg: #11261a;
  --code-bg: #eef1f6;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151d; --surface: #181e29; --fg: #e4e8f0; --muted: #98a2b5; --line: #2b3342;
    --accent: #7d9bf0; --accent-soft: #1f2a45; --up: #3cc28b; --down: #ef7a72;
    --warn-bg: #3a2f12; --warn-fg: #f3d58a; --bubble: #1f4a33; --bubble-fg: #e6f5ea; --code-bg: #212938;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151d; --surface: #181e29; --fg: #e4e8f0; --muted: #98a2b5; --line: #2b3342;
  --accent: #7d9bf0; --accent-soft: #1f2a45; --up: #3cc28b; --down: #ef7a72;
  --warn-bg: #3a2f12; --warn-fg: #f3d58a; --bubble: #1f4a33; --bubble-fg: #e6f5ea; --code-bg: #212938;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 16px; line-height: 1.55; padding-inline: 16px; padding-block: 32px 64px; }
.wrap { max-width: 720px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
h1, h2, h3 { text-wrap: balance; line-height: 1.2; margin: 0; }
h1 { font-size: 2rem; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: 1.25rem; font-weight: 600; }
p { margin: 0; max-width: 65ch; }
a { color: var(--accent); }
code, .mono { font-family: var(--font-mono); font-size: 0.92em; }
code { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; overflow-wrap: anywhere; }
.muted { color: var(--muted); }
.eyebrow { font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }

header { display: flex; flex-direction: column; gap: 14px; }
.facts { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 0.92rem; }
.facts b { color: var(--fg); font-weight: 600; }
.preview { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
.bubble { align-self: flex-start; max-width: 100%; background: var(--bubble); color: var(--bubble-fg); padding: 8px 12px 6px; border-radius: 10px 10px 10px 2px; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
.bubble .t { display: block; text-align: right; font-size: 0.72rem; opacity: 0.7; }
.up { color: var(--up); font-weight: 600; }

ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ol.steps > li { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 16px; position: relative; padding-bottom: 36px; }
ol.steps > li:last-child { padding-bottom: 0; }
ol.steps > li::before { content: ""; position: absolute; left: 17px; top: 36px; bottom: 0; width: 2px; background: var(--line); }
ol.steps > li:last-child::before { display: none; }
.num { width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-variant-numeric: tabular-nums; background: var(--bg); position: relative; }
.step { display: flex; flex-direction: column; gap: 12px; min-width: 0; padding-top: 4px; }
.step ul, .step ol { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; }
.where { font-size: 0.85rem; color: var(--muted); }

.copyrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; background: var(--code-bg); border-radius: 6px; padding: 8px 8px 8px 12px; }
.copyrow .val { font-family: var(--font-mono); font-size: 0.95rem; flex: 1 1 200px; min-width: 0; overflow-wrap: anywhere; }
button { font: inherit; cursor: pointer; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 6px; padding: 6px 12px; font-size: 0.88rem; font-weight: 500; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); padding: 10px 18px; font-size: 1rem; font-weight: 600; }
.btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

table.settings { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
table.settings th, table.settings td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.settings th { width: 34%; font-weight: 500; color: var(--muted); }
.tablebox { overflow-x: auto; }

.note { background: var(--warn-bg); color: var(--warn-fg); border-radius: 6px; padding: 10px 14px; font-size: 0.92rem; }

.form { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-weight: 600; font-size: 0.95rem; }
.field input[type=text] { font-family: var(--font-mono); font-size: 0.95rem; padding: 9px 11px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); width: 100%; }
.field input.bad { border-color: var(--down); }
.field .hint { font-size: 0.82rem; color: var(--muted); }
.field .err { font-size: 0.82rem; color: var(--down); }
.radios { display: flex; gap: 18px; flex-wrap: wrap; }
.radios label { font-weight: 400; display: flex; gap: 6px; align-items: center; }
.out { display: flex; flex-direction: column; gap: 10px; }
.out textarea, #upd { width: 100%; height: 160px; font-family: var(--font-mono); font-size: 0.78rem; border: 1px solid var(--line); border-radius: 6px; background: var(--code-bg); color: var(--fg); padding: 10px; resize: vertical; }
.status { font-size: 0.9rem; }
.status.ok { color: var(--up); font-weight: 600; }
.privacy { font-size: 0.82rem; color: var(--muted); }

details { border-top: 1px solid var(--line); padding-top: 14px; }
details + details { margin-top: 0; }
summary { cursor: pointer; font-weight: 600; }
details > div { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
ol.plain { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; max-width: 65ch; }
.extra { display: flex; flex-direction: column; gap: 14px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
