# Einmal-Backtest "London-Retest" (GBP/JPY, 1-Min-Kurse von Dukascopy). Läuft nur auf dem Branch
# backtest/london-retest, nicht auf main; der Server ist davon nicht betroffen. Ergebnisse landen in ergebnisse/.
name: Backtest London-Retest

on:
  push:
    branches: [backtest/london-retest]
    paths: ["backtest/**", ".github/workflows/backtest-london.yml"]

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurse laden (Bid und Ask, 1 Minute)
        run: |
          for p in bid ask; do
            npx -y dukascopy-node@1.51.1 -i gbpjpy -from 2026-05-15 -to now -t m1 -p "$p" -f csv \
              -dir daten -fn "gbpjpy_m1_$p" -r 5 -rp 2000 -bs 5 -bp 1500 \
              --chrome-path "$(command -v google-chrome || true)" -s
          done
          ls -la daten
          head -3 daten/*bid*.csv
      - name: Backtest
        run: |
          python3 -I backtest/london_retest.py "$(ls daten/*bid*.csv | head -1)" "$(ls daten/*ask*.csv | head -1)" ergebnisse 100
      - name: Ergebnisse sichern
        run: |
          git config user.name "fx-backtest"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ergebnisse
          git commit -m "Backtest-Ergebnisse London-Retest ($(date -u +%F))" || echo "keine Änderungen"
          git push
